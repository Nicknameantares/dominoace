<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRICKO — Домино</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f1e9;
    color: #222;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* ---------- HOME ---------- */

.screen {
    min-height: 100vh;
}

.home {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.home-card {
    width: 100%;
    max-width: 420px;
    background: white;
    border-radius: 24px;
    padding: 32px 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,.08);
    text-align: center;
}

.logo {
    font-size: 56px;
    margin-bottom: 8px;
}

.home-title {
    font-size: 34px;
    font-weight: 900;
    margin-bottom: 6px;
}

.home-subtitle {
    color: #777;
    margin-bottom: 28px;
}

.input {
    width: 100%;
    height: 52px;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 0 16px;
    outline: none;
    margin-bottom: 12px;
}

.input:focus {
    border-color: #236b42;
}

.btn {
    width: 100%;
    min-height: 50px;
    border: 0;
    border-radius: 12px;
    padding: 12px 18px;
    font-weight: 800;
    background: #236b42;
    color: white;
    margin-bottom: 10px;
}

.btn.secondary {
    background: #eeeae1;
    color: #222;
}

.btn.small {
    width: auto;
    min-height: 40px;
    margin: 0;
    padding: 8px 14px;
}

.home-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 15px 0;
    color: #aaa;
    font-size: 13px;
}

.home-divider:before,
.home-divider:after {
    content: "";
    height: 1px;
    background: #eee;
    flex: 1;
}

/* ---------- LOBBY ---------- */

.lobby {
    padding: 20px;
}

.lobby-card {
    max-width: 600px;
    margin: 30px auto;
    background: white;
    border-radius: 22px;
    padding: 24px;
}

.lobby-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 20px;
}

.lobby-title {
    font-size: 25px;
    font-weight: 900;
}

.room-code {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #f3f0e8;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 20px;
}

.room-code-value {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 3px;
}

.players-title {
    font-weight: 800;
    margin-bottom: 10px;
}

.player-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    background: #f8f7f3;
    border-radius: 10px;
    margin-bottom: 8px;
}

.player-name {
    font-weight: 700;
}

.host-label {
    font-size: 11px;
    color: #236b42;
    font-weight: 800;
}

.lobby-status {
    margin: 20px 0;
    padding: 14px;
    background: #f3f0e8;
    border-radius: 12px;
    text-align: center;
    color: #666;
}

/* ---------- GAME ---------- */

.game {
    min-height: 100vh;
    padding-bottom: 30px;
}

.game-header {
    background: white;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.game-title {
    font-size: 21px;
    font-weight: 900;
}

.round-label {
    font-size: 13px;
    color: #777;
}

.game-main {
    max-width: 760px;
    margin: 0 auto;
    padding: 12px;
}

/* ---------- SCOREBOARD ---------- */

.scoreboard {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 12px;
}

.score-player {
    background: white;
    border-radius: 12px;
    padding: 10px;
    min-width: 0;
}

.score-player.me {
    border: 2px solid #236b42;
}

.score-player-name {
    font-weight: 800;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.score {
    font-size: 22px;
    font-weight: 900;
    margin-top: 5px;
}

.small {
    font-size: 11px;
    color: #888;
}

/* ---------- TABLE ---------- */

.table {
    background: #236b42;
    border-radius: 22px;
    min-height: 310px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 0 4px rgba(255,255,255,.04);
}

.table-message {
    color: white;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 18px;
}

.trick {
    min-height: 170px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

/* ---------- DOMINO ---------- */

.domino {
    width: 58px;
    height: 112px;
    background: white;
    border-radius: 9px;
    border: 1px solid #ccc;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 3px 7px rgba(0,0,0,.2);
    flex-shrink: 0;
}

.domino-half {
    height: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.domino-half:first-child {
    border-bottom: 1px solid #bbb;
}

.domino-pips {
    position: relative;
    width: 38px;
    height: 38px;
}

.pip {
    width: 7px;
    height: 7px;
    background: #222;
    border-radius: 50%;
    position: absolute;
}

.p1 { left: 0; top: 0; }
.p2 { left: 50%; top: 0; transform: translateX(-50%); }
.p3 { right: 0; top: 0; }
.p4 { left: 0; top: 50%; transform: translateY(-50%); }
.p5 { left: 50%; top: 50%; transform: translate(-50%, -50%); }
.p6 { right: 0; top: 50%; transform: translateY(-50%); }
.p7 { left: 0; bottom: 0; }
.p8 { left: 50%; bottom: 0; transform: translateX(-50%); }
.p9 { right: 0; bottom: 0; }

.hand {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding: 14px 2px 8px;
    justify-content: center;
}

.hand .domino {
    cursor: pointer;
    transition: transform .15s;
}

.hand .domino:hover {
    transform: translateY(-5px);
}

.hand .domino.disabled {
    opacity: .4;
    cursor: default;
}

/* ---------- BIDS / TRICKS ---------- */

.info-panel {
    margin-top: 12px;
}

.player-stats {
    background: white;
    border-radius: 16px;
    padding: 14px;
}

.player-stats-title {
    font-weight: 800;
    margin-bottom: 10px;
}

.player-stat {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 8px;
    border-bottom: 1px solid #eee;
}

.player-stat:last-child {
    border-bottom: 0;
}

.player-stat.current {
    background: #f3f0e8;
    border-radius: 10px;
}

.player-stat-left {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
}

.player-stat-name {
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.player-stat-status {
    font-size: 11px;
    color: #888;
    margin-top: 2px;
}

.player-stat-right {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
}

.stat-badge {
    padding: 5px 8px;
    border-radius: 7px;
    background: #eeeae1;
    font-size: 12px;
    white-space: nowrap;
}

.stat-badge.bid {
    font-weight: 800;
}

.stat-badge.tricks {
    background: #236b42;
    color: white;
    font-weight: 800;
}

.stat-badge.pending {
    color: #888;
    font-weight: 400;
}

/* ---------- BID AREA ---------- */

.bid-area {
    background: white;
    border-radius: 16px;
    padding: 14px;
    margin-top: 12px;
}

.bid-title {
    font-weight: 800;
    margin-bottom: 10px;
    text-align: center;
}

.bid-buttons {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 7px;
}

.bid-button {
    border: 0;
    background: #eeeae1;
    border-radius: 9px;
    min-height: 42px;
    font-weight: 900;
}

.bid-button:hover {
    background: #236b42;
    color: white;
}

.waiting {
    text-align: center;
    color: #777;
    padding: 10px;
}

/* ---------- RESULT ---------- */

.result {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.result-card {
    width: 100%;
    max-width: 500px;
    background: white;
    border-radius: 24px;
    padding: 30px 22px;
    text-align: center;
}

.result-trophy {
    font-size: 60px;
}

.result-title {
    font-size: 30px;
    font-weight: 900;
    margin: 10px 0;
}

.result-winner {
    font-size: 20px;
    font-weight: 800;
    color: #236b42;
    margin-bottom: 20px;
}

.final-player {
    display: flex;
    justify-content: space-between;
    padding: 12px;
    border-bottom: 1px solid #eee;
}

.final-player-name {
    font-weight: 700;
}

/* ---------- TOAST ---------- */

.toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    background: #222;
    color: white;
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 14px;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
}

.toast.show {
    opacity: 1;
}

/* ---------- MOBILE ---------- */

@media (max-width: 600px) {

    .home-card {
        padding: 26px 18px;
    }

    .scoreboard {
        grid-template-columns: repeat(2, 1fr);
    }

    .table {
        min-height: 260px;
    }

    .trick {
        min-height: 130px;
    }

    .domino {
        width: 50px;
        height: 96px;
    }

    .hand {
        justify-content: flex-start;
    }

    .player-stat {
        padding: 9px 4px;
    }

    .player-stat-right {
        gap: 4px;
    }

    .stat-badge {
        padding: 4px 6px;
        font-size: 11px;
    }

    .bid-buttons {
        grid-template-columns: repeat(7, 1fr);
    }

    .bid-button {
        min-height: 38px;
    }
}
</style>
</head>

<body>

<!-- HOME -->
<div id="homeScreen" class="screen home">
    <div class="home-card">

        <div class="logo">🀄</div>

        <div class="home-title">TRICKO</div>

        <div class="home-subtitle">
            Bid. Play. Take.
        </div>

        <input
            id="nickname"
            class="input"
            maxlength="20"
            placeholder="Ваше имя"
        >

        <button id="createBtn" class="btn">
            Создать игру
        </button>

        <div class="home-divider">
            или
        </div>

        <input
            id="roomInput"
            class="input"
            maxlength="6"
            placeholder="Код игры"
            style="text-transform:uppercase"
        >

        <button id="joinBtn" class="btn secondary">
            Войти в игру
        </button>

    </div>
</div>


<!-- LOBBY -->
<div id="lobbyScreen" class="screen lobby hidden">

    <div class="lobby-card">

        <div class="lobby-header">

            <div class="lobby-title">
                Комната
            </div>

            <button id="leaveLobbyBtn" class="btn small secondary">
                Выйти
            </button>

        </div>

        <div class="room-code">

            <div>
                <div class="small">Код игры</div>
                <div id="roomCode" class="room-code-value"></div>
            </div>

            <button id="copyRoomBtn" class="btn small">
                Копировать
            </button>

        </div>

        <div class="players-title">
            Игроки
        </div>

        <div id="lobbyPlayers"></div>

        <div id="lobbyStatus" class="lobby-status">
            Ожидание игроков...
        </div>

    </div>

</div>


<!-- GAME -->
<div id="gameScreen" class="screen game hidden">

    <div class="game-header">

        <div>
            <div class="game-title">TRICKO</div>
            <div id="roundLabel" class="round-label"></div>
        </div>

        <button id="leaveGameBtn" class="btn small secondary">
            Выйти
        </button>

    </div>

    <div class="game-main">

        <div id="scoreboard" class="scoreboard"></div>

        <div class="table">

            <div id="tableMessage" class="table-message"></div>

            <div id="trick" class="trick"></div>

        </div>

        <div id="hand" class="hand"></div>

        <div id="bidArea" class="bid-area"></div>

        <div id="roundInfoPanel" class="info-panel"></div>

    </div>

</div>


<!-- RESULT -->
<div id="resultScreen" class="screen result hidden">

    <div class="result-card">

        <div class="result-trophy">
            🏆
        </div>

        <div class="result-title">
            Игра окончена
        </div>

        <div id="winner" class="result-winner"></div>

        <div id="finalScores"></div>

        <button id="newGameBtn" class="btn">
            Новая игра
        </button>

    </div>

</div>


<div id="toast" class="toast"></div>


<script>

/* =========================================================
   BASIC
========================================================= */

const $ = id => document.getElementById(id);

let peer = null;
let isHost = false;
let roomCode = "";
let myId = "";
let myPlayerIndex = -1;

let connections = {};

let game = null;

let renderTimer = null;


/* =========================================================
   STORAGE
========================================================= */

const savedNickname =
    localStorage.getItem("tricko_nickname") || "";

$("nickname").value = savedNickname;


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function toast(text) {

    const el = $("toast");

    el.textContent = text;

    el.classList.add("show");

    setTimeout(() => {
        el.classList.remove("show");
    }, 2200);
}


function showScreen(name) {

    $("homeScreen").classList.add("hidden");
    $("lobbyScreen").classList.add("hidden");
    $("gameScreen").classList.add("hidden");
    $("resultScreen").classList.add("hidden");

    $(name).classList.remove("hidden");
}


/* =========================================================
   ROOM CODE
========================================================= */

function randomRoomCode(length = 5) {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for (let i = 0; i < length; i++) {

        result +=
            chars[Math.floor(Math.random() * chars.length)];
    }

    return result;
}


/* =========================================================
   DOMINO DECK
========================================================= */

function createDeck() {

    const deck = [];

    let id = 0;

    for (let a = 0; a <= 6; a++) {

        for (let b = a; b <= 6; b++) {

            deck.push({
                id: id++,
                a,
                b
            });
        }
    }

    return deck;
}


function shuffle(array) {

    const arr = [...array];

    for (let i = arr.length - 1; i > 0; i--) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] =
            [arr[j], arr[i]];
    }

    return arr;
}


/* =========================================================
   TILE STRENGTH
========================================================= */

function isTrump(tile) {

    return tile.a === tile.b;
}


function trumpRank(tile) {

    if (!isTrump(tile)) return 0;

    const ranks = {
        1: 7,
        2: 6,
        3: 5,
        4: 4,
        5: 3,
        6: 2,
        0: 1
    };

    return ranks[tile.a];
}


function tileStrength(tile) {

    if (isTrump(tile)) {

        return 100 + trumpRank(tile);
    }

    return tile.a + tile.b;
}


/*
    Важно:

    Если сила одинаковая, выигрывает первый сыгранный тайл.
    Поэтому compareTiles возвращает true только если newTile
    строго сильнее oldTile.
*/

function compareTiles(newTile, oldTile) {

    return tileStrength(newTile) >
           tileStrength(oldTile);
}


/* =========================================================
   ROUND SEQUENCE
========================================================= */

function getRoundSizes(playerCount) {

    return [
        1,
        2,
        3,
        4,
        5,

        ...Array(playerCount).fill(6),

        5,
        4,
        3,
        2,
        1,

        6
    ];
}


/* =========================================================
   HOST GAME CREATION
========================================================= */

function createGameState() {

    return {

        players: [],

        roundIndex: 0,
        roundTotal: 0,

        phase: "lobby",

        dealerStart: 0,
        firstBidder: 0,

        currentPlayer: 0,

        trick: [],
        trickNumber: 0,

        lastTrickWinner: null,

        winner: null

    };
}


/* =========================================================
   PUBLIC STATE
========================================================= */

function publicGameState() {

    if (!game) return null;

    return {

        players: game.players.map(p => ({

            id: p.id,
            nick: p.nick,

            score: p.score,
            roundScore: p.roundScore,

            /*
                ВАЖНО:

                bid и tricks передаются всем игрокам.

                Поэтому после каждой ставки все игроки
                получают обновлённое состояние.
            */

            bid: p.bid,
            tricks: p.tricks,

            connected: p.connected,

            handCount: p.hand.length

        })),

        roundIndex: game.roundIndex,
        roundTotal: game.roundTotal,

        phase: game.phase,

        dealerStart: game.dealerStart,
        firstBidder: game.firstBidder,

        currentPlayer: game.currentPlayer,

        trick: game.trick,

        trickNumber: game.trickNumber,

        lastTrickWinner:
            game.lastTrickWinner,

        winner: game.winner

    };
}


/* =========================================================
   SEND STATE
========================================================= */

function sendFullState() {

    if (!isHost || !game) return;

    const publicState =
        publicGameState();

    /*
        Отправляем каждому игроку
        его собственную руку.
    */

    game.players.forEach(player => {

        const payload = {

            type: "state",

            game: publicState,

            myHand: player.hand,

            myId: player.id

        };

        if (player.id === myId) {

            mergePublicState(payload);

        } else {

            const conn =
                connections[player.id];

            if (
                conn &&
                conn.open
            ) {

                conn.send(payload);
            }
        }

    });
}


/* =========================================================
   MERGE STATE FOR CLIENT
========================================================= */

function mergePublicState(payload) {

    if (!payload || !payload.game)
        return;

    const oldHand =
        game?.myHand || [];

    game = {

        ...payload.game,

        myHand:
            payload.myHand || oldHand

    };

    myId =
        payload.myId || myId;

    myPlayerIndex =
        game.players.findIndex(
            p => p.id === myId
        );

    render();
}


/* =========================================================
   START ROUND
========================================================= */

function startRound() {

    const playerCount =
        game.players.length;

    const roundSizes =
        getRoundSizes(playerCount);

    game.roundTotal =
        roundSizes.length;

    const handSize =
        roundSizes[game.roundIndex] || 6;

    game.firstBidder =
        game.roundIndex % playerCount;

    game.currentPlayer =
        game.firstBidder;

    game.trick = [];

    game.trickNumber = 0;

    game.lastTrickWinner = null;

    game.phase = "bidding";

    const deck =
        shuffle(createDeck());

    game.players.forEach(player => {

        player.hand =
            deck.splice(0, handSize);

        player.bid = null;
        player.tricks = 0;
        player.roundScore = 0;

    });

    sendFullState();

    toast(
        `Раунд ${game.roundIndex + 1}. Ставки`
    );
}


/* =========================================================
   START TRICK PLAY
========================================================= */

function startTrickPlay() {

    game.phase = "playing";

    game.currentPlayer =
        game.firstBidder;

    game.trick = [];

    game.trickNumber = 0;

    sendFullState();

    const bidder =
        game.players[game.currentPlayer];

    toast(
        `${bidder.nick} ходит первым`
    );
}


/* =========================================================
   RECEIVE BID
========================================================= */

function hostReceiveBid(
    playerId,
    value
) {

    if (
        !game ||
        game.phase !== "bidding"
    ) return;

    const playerIndex =
        game.players.findIndex(
            p => p.id === playerId
        );

    if (playerIndex === -1)
        return;

    if (
        playerIndex !==
        game.currentPlayer
    ) return;

    const player =
        game.players[playerIndex];

    const maxBid =
        player.hand.length;

    value =
        Number(value);

    if (
        !Number.isInteger(value) ||
        value < 0 ||
        value > maxBid
    ) return;

    /*
        Сохраняем ставку.

        После этого sendFullState()
        немедленно показывает её всем.
    */

    player.bid = value;

    /*
        Если ставки ещё остались —
        передаём ход следующему игроку.
    */

    const nextPlayer =
        game.players.findIndex(
            p => p.bid === null
        );

    if (nextPlayer !== -1) {

        game.currentPlayer =
            nextPlayer;

    } else {

        /*
            Все сделали ставки.
            Теперь все заявки уже видны всем.
        */

        startTrickPlay();

        return;
    }

    sendFullState();
}


/* =========================================================
   RECEIVE PLAY
========================================================= */

function hostReceivePlay(
    playerId,
    tileId
) {

    if (
        !game ||
        game.phase !== "playing"
    ) return;

    const playerIndex =
        game.players.findIndex(
            p => p.id === playerId
        );

    if (playerIndex === -1)
        return;

    if (
        playerIndex !==
        game.currentPlayer
    ) return;

    const player =
        game.players[playerIndex];

    const tileIndex =
        player.hand.findIndex(
            t => t.id === tileId
        );

    if (tileIndex === -1)
        return;

    const tile =
        player.hand[tileIndex];

    player.hand.splice(
        tileIndex,
        1
    );

    game.trick.push({

        playerIndex,

        tile

    });

    /*
        Если все игроки сходили —
        определяем победителя взятки.
    */

    if (
        game.trick.length ===
        game.players.length
    ) {

        resolveTrick();

        return;
    }

    /*
        Следующий игрок по кругу.
    */

    game.currentPlayer =
        (
            game.currentPlayer + 1
        ) %
        game.players.length;

    sendFullState();
}


/* =========================================================
   RESOLVE TRICK
========================================================= */

function resolveTrick() {

    let winner =
        game.trick[0];

    for (
        let i = 1;
        i < game.trick.length;
        i++
    ) {

        const candidate =
            game.trick[i];

        if (
            compareTiles(
                candidate.tile,
                winner.tile
            )
        ) {

            winner = candidate;
        }
    }

    game.players[
        winner.playerIndex
    ].tricks++;

    game.lastTrickWinner =
        winner.playerIndex;

    game.currentPlayer =
        winner.playerIndex;

    game.trickNumber++;

    game.phase =
        "trickResult";

    sendFullState();

    setTimeout(() => {

        /*
            Проверяем, закончились ли карты.
        */

        const cardsLeft =
            game.players.some(
                p => p.hand.length > 0
            );

        if (!cardsLeft) {

            finishRound();

            return;
        }

        game.trick = [];

        game.phase = "playing";

        sendFullState();

    }, 1300);
}


/* =========================================================
   SCORING
========================================================= */

function calculateRoundScore(player) {

    const bid =
        player.bid;

    const tricks =
        player.tricks;

    if (
        bid === 0 &&
        tricks === 0
    ) {

        return 5;
    }

    if (
        bid > 0 &&
        tricks === bid
    ) {

        return 10 * bid;
    }

    if (
        tricks > bid
    ) {

        return tricks;
    }

    /*
        Недобор.
    */

    return -10 * bid;
}


/* =========================================================
   FINISH ROUND
========================================================= */

function finishRound() {

    game.phase =
        "roundResult";

    game.players.forEach(
        player => {

            player.roundScore =
                calculateRoundScore(player);

            player.score +=
                player.roundScore;

        }
    );

    sendFullState();

    setTimeout(() => {

        if (
            game.roundIndex + 1 <
            game.roundTotal
        ) {

            game.roundIndex++;

            startRound();

        } else {

            finishCycle();

        }

    }, 2200);
}


/* =========================================================
   FINISH CYCLE
========================================================= */

function finishCycle() {

    const maxScore =
        Math.max(
            ...game.players.map(
                p => p.score
            )
        );

    const winners =
        game.players.filter(
            p => p.score === maxScore
        );

    /*
        Один победитель.
    */

    if (winners.length === 1) {

        game.phase =
            "finished";

        game.winner =
            winners[0].id;

        sendFullState();

        return;
    }

    /*
        Ничья.

        Дополнительный раунд на 6 карт
        только среди текущих лидеров.
    */

    game.roundIndex++;

    game.roundTotal =
        game.roundIndex + 1;

    game.firstBidder =
        (game.roundIndex - 1) %
        game.players.length;

    game.currentPlayer =
        game.firstBidder;

    game.phase =
        "bidding";

    game.trick = [];

    game.trickNumber = 0;

    const deck =
        shuffle(createDeck());

    game.players.forEach(player => {

        player.hand =
            deck.splice(0, 6);

        player.bid = null;
        player.tricks = 0;
        player.roundScore = 0;

    });

    sendFullState();

    toast(
        "Ничья! Дополнительный раунд"
    );
}

/* =========================================================
   DOMINO RENDER
========================================================= */

function renderDomino(tile) {

    return `
        <div class="domino">

            <div class="domino-half">
                ${renderPips(tile.a)}
            </div>

            <div class="domino-half">
                ${renderPips(tile.b)}
            </div>

        </div>
    `;
}


function renderPips(number) {

    const positions = {

        1: ["p5"],

        2: ["p1", "p9"],

        3: ["p1", "p5", "p9"],

        4: ["p1", "p3", "p7", "p9"],

        5: ["p1", "p3", "p5", "p7", "p9"],

        6: ["p1", "p3", "p4", "p6", "p7", "p9"]

    };

    if (number === 0) {

        return `
            <div class="domino-pips"></div>
        `;
    }

    return `
        <div class="domino-pips">

            ${positions[number]
                .map(
                    p =>
                        `<span class="pip ${p}"></span>`
                )
                .join("")
            }

        </div>
    `;
}

                        <div class="domino-half">
                            ${renderPips(tile.a)}
                        </div>

                        <div class="domino-half">
                            ${renderPips(tile.b)}
                        </div>

        ).join("");
}

/* =========================================================
   MAKE BID
========================================================= */

function makeBid(value) {

    if (
        !game ||
        game.phase !== "bidding"
    ) return;

    const current =
        game.players[
            game.currentPlayer
        ];

    if (
        !current ||
        current.id !== myId
    ) return;

    if (isHost) {

        hostReceiveBid(
            myId,
            value
        );

    } else {

        sendToHost({

            type: "bid",

            value

        });
    }
}


/* =========================================================
   PLAY TILE
========================================================= */

function playTile(tileId) {

    if (
        !game ||
        game.phase !== "playing"
    ) return;

    const current =
        game.players[
            game.currentPlayer
        ];

    if (
        !current ||
        current.id !== myId
    ) return;

    if (isHost) {

        hostReceivePlay(
            myId,
            tileId
        );

    } else {

        sendToHost({

            type: "play",

            tileId

        });
    }
}


/* =========================================================
   HOST CONNECTION
========================================================= */

function setupHostPeer() {

    peer = new Peer(
        "domino-" + roomCode
    );

    peer.on(
        "open",
        id => {

            myId = id;

            game =
                createGameState();

            game.players.push({

                id: myId,

                nick:
                    localStorage.getItem(
                        "tricko_nickname"
                    ),

                score: 0,
                roundScore: 0,

                bid: null,
                tricks: 0,

                connected: true,

                hand: []

            });

            game.phase =
                "lobby";

            showScreen(
                "lobbyScreen"
            );

            render();

            toast(
                "Комната создана"
            );
        }
    );


    peer.on(
        "connection",
        conn => {

            connections[conn.peer] =
                conn;

            conn.on(
                "data",
                data => {

                    handleHostMessage(
                        conn,
                        data
                    );

                }
            );

            conn.on(
                "close",
                () => {

                    const player =
                        game?.players.find(
                            p =>
                                p.id ===
                                conn.peer
                        );

                    if (player) {

                        player.connected =
                            false;

                        sendFullState();
                    }
                }
            );
        }
    );


    peer.on(
        "error",
        error => {

            console.error(error);

            if (
                error.type ===
                "unavailable-id"
            ) {

                toast(
                    "Такой код уже занят"
                );
            }

        }
    );
}


/* =========================================================
   HOST MESSAGE
========================================================= */

function handleHostMessage(
    conn,
    data
) {

    if (
        !data ||
        !game
    ) return;

    if (
        data.type === "join"
    ) {

        if (
            game.players.length >= 4
        ) {

            conn.send({

                type: "error",

                message:
                    "В комнате уже 4 игрока"

            });

            return;
        }

        const exists =
            game.players.some(
                p =>
                    p.id ===
                    conn.peer
            );

        if (exists) return;

        game.players.push({

            id: conn.peer,

            nick:
                String(
                    data.nick || "Игрок"
                ).slice(0, 20),

            score: 0,
            roundScore: 0,

            bid: null,
            tricks: 0,

            connected: true,

            hand: []

        });

        sendFullState();

        /*
            Автоматически запускаем игру
            через несколько секунд после
            появления второго игрока.
        */

        if (
            game.players.length >= 2 &&
            game.phase === "lobby"
        ) {

            setTimeout(() => {

                if (
                    game.phase === "lobby" &&
                    game.players.length >= 2
                ) {

                    game.roundIndex = 0;

                    startRound();
                }

            }, 4000);
        }
    }


    if (
        data.type === "bid"
    ) {

        hostReceiveBid(
            conn.peer,
            data.value
        );
    }


    if (
        data.type === "play"
    ) {

        hostReceivePlay(
            conn.peer,
            data.tileId
        );
    }
}


/* =========================================================
   JOIN
========================================================= */

function joinRoom() {

    const nick =
        $("nickname")
            .value
            .trim();

    const code =
        $("roomInput")
            .value
            .trim()
            .toUpperCase();

    if (!nick) {

        toast(
            "Введите имя"
        );

        return;
    }

    if (!code) {

        toast(
            "Введите код игры"
        );

        return;
    }

    localStorage.setItem(
        "tricko_nickname",
        nick
    );

    roomCode =
        code;

    isHost = false;

    peer =
        new Peer();

    peer.on(
        "open",
        id => {

            myId = id;

            const hostId =
                "domino-" + roomCode;

            const conn =
                peer.connect(
                    hostId,
                    {
                        reliable: true
                    }
                );

            connections.host =
                conn;

            conn.on(
                "open",
                () => {

                    conn.send({

                        type: "join",

                        nick

                    });

                    toast(
                        "Подключение..."
                    );
                }
            );

            conn.on(
                "data",
                data => {

                    if (
                        data.type ===
                        "state"
                    ) {

                        mergePublicState(
                            data
                        );
                    }

                    if (
                        data.type ===
                        "error"
                    ) {

                        toast(
                            data.message
                        );
                    }
                }
            );

            conn.on(
                "close",
                () => {

                    toast(
                        "Соединение с хостом потеряно"
                    );
                }
            );
        }
    );


    peer.on(
        "error",
        error => {

            console.error(error);

            toast(
                "Не удалось подключиться"
            );
        }
    );
}


/* =========================================================
   SEND TO HOST
========================================================= */

function sendToHost(data) {

    const conn =
        connections.host;

    if (
        conn &&
        conn.open
    ) {

        conn.send(data);

    } else {

        toast(
            "Нет соединения"
        );
    }
}

    if (

        try {
            peer.destroy();

    peer = null;

    connections = {};

    game = null;

    roomCode = "";

    isHost = false;

    showScreen(

    );


$("roomInput")
    .addEventListener(
        "input",
        e => {

            e.target.value =
                e.target.value
                    .toUpperCase()
                    .replace(
                        /[^A-Z0-9]/g,
                        ""
                    )
                    .slice(0, 6);

        }
    );


$("nickname")
    .addEventListener(
        "input",
        e => {

            localStorage.setItem(
                "tricko_nickname",
                e.target.value
            );

        }
    );


/* =========================================================
   RENDER LOOP
========================================================= */

renderTimer =
    setInterval(
        () => {

            if (game) {
                render();
            }

        },
        1000
    );

</script>

</body>
</html>
