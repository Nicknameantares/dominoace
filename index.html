<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TRICKO — домино на взятки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --felt-0: #1c3a2c;
    --felt-1: #234634;
    --ivory: #f3ecd9;
    --ivory-dim: #e4dabf;
    --ink: #1c1a15;
    --ink-soft: #4a463d;
    --gold: #c8a24b;
    --gold-bright: #e0bd6a;
    --rose: #b5544a;
    --line: rgba(243,236,217,0.16);
    --radius: 10px;
    --shadow: 0 10px 28px rgba(0,0,0,0.35);
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, var(--felt-1), var(--felt-0) 70%);
    color: var(--ivory);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,.display{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }
  #app{
    max-width: 920px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }
  .brand{
    display:flex; align-items:baseline; gap:10px; justify-content:center;
    margin-bottom: 26px;
  }
  .brand .display{ font-size: 2.1rem; color: var(--gold-bright); }
  .brand .sub{ color: var(--ivory-dim); font-size: 0.85rem; }

  .panel{
    background: rgba(23,45,34,0.62);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
  }
  .panel + .panel{ margin-top: 16px; }

  label{ display:block; font-size:0.8rem; color: var(--ivory-dim); margin-bottom:6px; }
  input[type=text]{
    width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line);
    background: rgba(0,0,0,0.22); color: var(--ivory); font-size:1rem; font-family: inherit;
  }
  input[type=text]:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  input[type=text]::placeholder{ color: rgba(243,236,217,0.35); }

  .row{ display:flex; gap:12px; flex-wrap:wrap; }
  .row > *{ flex:1; min-width:180px; }

  button{
    font-family:inherit; font-size:0.95rem; font-weight:600; cursor:pointer;
    border-radius: 8px; border: 1px solid transparent; padding: 11px 18px;
    transition: transform .08s ease, filter .12s ease;
  }
  button:active{ transform: translateY(1px); }
  button:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-gold{ background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color:#221a08; }
  .btn-gold:hover:not(:disabled){ filter: brightness(1.06); }
  .btn-ghost{ background: transparent; color: var(--ivory); border-color: var(--line); }
  .btn-ghost:hover:not(:disabled){ background: rgba(243,236,217,0.08); }
  .btn-small{ padding: 7px 12px; font-size: 0.82rem; }

  .code-display{
    font-family:'Fraunces', serif; font-size: 2rem; letter-spacing: 0.12em;
    color: var(--gold-bright); text-align:center; padding: 10px 0;
  }
  .hint{ color: var(--ivory-dim); font-size: 0.85rem; line-height:1.5; }
  .error-box{
    background: rgba(181,84,74,0.18); border:1px solid rgba(181,84,74,0.5);
    color:#f2c9c4; padding:10px 13px; border-radius:8px; font-size:0.88rem; margin-top:10px;
  }

  .player-chip-list{ display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
  .player-chip{
    background: rgba(0,0,0,0.25); border:1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; font-size:0.88rem; display:flex; align-items:center; gap:6px;
  }
  .player-chip .tag{ font-size:0.7rem; color: var(--gold-bright); }

  /* --- in-game top bar --- */
  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 14px; flex-wrap:wrap; gap:8px;}
  .topbar .room{ font-size:0.82rem; color: var(--ivory-dim); }
  .topbar .phase{ font-size:0.82rem; color: var(--gold-bright); text-transform: none; }

  .board{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
    gap:10px; margin-bottom:16px;
  }
  .seat{
    background: rgba(0,0,0,0.24); border:1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; position:relative;
  }
  .seat.active{ border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  .seat.you::after{
    content:"вы"; position:absolute; top:10px; right:12px; font-size:0.68rem; color: var(--ivory-dim);
  }
  .seat .name{ font-weight:600; font-size:1rem; margin-bottom:6px; }
  .seat .score{ font-family:'Fraunces',serif; font-size:1.5rem; color: var(--gold-bright); }
  .seat .stat-line{ margin-top:6px; font-size:0.82rem; color: var(--ivory-dim); display:flex; gap:10px; }
  .seat .stat-line b{ color: var(--ivory); font-weight:600; }
  .seat .last-round{ margin-top:4px; font-size:0.76rem; }
  .seat .last-round.pos{ color:#8fd6a6; }
  .seat .last-round.neg{ color:#e39c94; }

  .trick-area{
    min-height: 130px; display:flex; align-items:center; justify-content:center; gap:16px;
    background: rgba(0,0,0,0.18); border-radius: var(--radius); border:1px dashed var(--line);
    padding: 16px; margin-bottom:16px; flex-wrap:wrap;
  }
  .trick-slot{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .trick-slot .who{ font-size:0.74rem; color: var(--ivory-dim); }
  .trick-empty{ color: var(--ivory-dim); font-size:0.85rem; }

  /* domino tile */
  .domino{
    display:flex; background: var(--ivory); border-radius:6px; box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    border: 1px solid rgba(0,0,0,0.2); overflow:hidden;
  }
  .domino.trump{ box-shadow: 0 0 0 2px var(--gold), 0 3px 8px rgba(0,0,0,0.4); }
  .domino-half{
    width:34px; height:34px; display:grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr);
    padding:4px;
  }
  .domino-half + .domino-half{ border-left: 1px solid rgba(0,0,0,0.25); }
  .pip{ border-radius:50%; }
  .pip.on{ background: var(--ink); margin:auto; width:5px; height:5px; }
  .domino.big .domino-half{ width:46px; height:46px; padding:5px; }
  .domino.big .pip.on{ width:7px; height:7px; }

  .hand-row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; padding: 6px 0 2px; }
  .hand-tile-btn{ background:none; border:none; padding:0; border-radius:6px; cursor:pointer; }
  .hand-tile-btn:disabled{ cursor:default; opacity:0.55; }
  .hand-tile-btn:not(:disabled):hover .domino{ transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
  .hand-tile-btn .domino{ transition: transform .1s ease, box-shadow .1s ease; }

  .bid-grid{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
  .bid-btn{
    width:44px; height:44px; border-radius:50%; background: rgba(0,0,0,0.25);
    border:1px solid var(--line); color: var(--ivory); font-weight:700; font-size:1rem;
  }
  .bid-btn:hover:not(:disabled){ border-color: var(--gold); color: var(--gold-bright); }

  .center-note{ text-align:center; color: var(--ivory-dim); font-size:0.9rem; margin: 8px 0 4px; }
  .center-note b{ color: var(--gold-bright); }

  .result-table{ width:100%; border-collapse: collapse; margin-top:8px; }
  .result-table th, .result-table td{ text-align:left; padding:8px 10px; font-size:0.88rem; border-bottom:1px solid var(--line); }
  .result-table th{ color: var(--ivory-dim); font-weight:500; font-size:0.76rem; }

  .final-winner{ text-align:center; padding: 10px 0 4px; }
  .final-winner .display{ font-size:1.9rem; color: var(--gold-bright); }

  .footer-note{ text-align:center; color: rgba(243,236,217,0.4); font-size:0.76rem; margin-top:28px; }

  @media (max-width: 480px){
    .brand .display{ font-size:1.6rem; }
    .domino-half{ width:28px; height:28px; }
    .domino.big .domino-half{ width:38px; height:38px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* =====================================================================
   TRICKO — домино на взятки. Host-авторитетная логика поверх PeerJS.
   ===================================================================== */

/* ---------- домино: утилиты ---------- */
function allTiles(){
  const t = [];
  for(let a=0;a<=6;a++) for(let b=a;b<=6;b++) t.push([a,b]);
  return t; // 28 костей
}
function isDouble(tile){ return tile[0]===tile[1]; }
const TRUMP_RANK = {1:7,2:6,3:5,4:4,5:3,6:2,0:1}; // выше = сильнее
function tileStrength(tile){
  if(isDouble(tile)) return { trump:true, rank: TRUMP_RANK[tile[0]] };
  return { trump:false, sum: tile[0]+tile[1] };
}
// возвращает true если entry a бьёт entry b ({tile, playIndex})
function beats(a,b){
  const sa=tileStrength(a.tile), sb=tileStrength(b.tile);
  if(sa.trump !== sb.trump) return sa.trump;
  if(sa.trump && sb.trump) return sa.rank > sb.rank;
  if(sa.sum !== sb.sum) return sa.sum > sb.sum;
  return a.playIndex < b.playIndex; // при равенстве раньше сыгранная сильнее
}
function findTrickWinner(entries){
  let w = entries[0];
  for(let i=1;i<entries.length;i++) if(beats(entries[i], w)) w = entries[i];
  return w;
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function buildSchedule(numPlayers){
  const seq = [1,2,3,4,5,6];
  for(let i=1;i<numPlayers;i++) seq.push(6);
  seq.push(5,4,3,2,1,6);
  return seq;
}
function rotateOrder(n, start){
  const arr=[]; for(let i=0;i<n;i++) arr.push((start+i)%n); return arr;
}
function randomRoomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='TRK-';
  for(let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

/* ---------- domino tile rendering ---------- */
const PIP_PATTERNS = {
  0: [], 1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,1,2,6,7,8]
};
function renderTileHTML(tile, opts){
  opts = opts || {};
  const cls = 'domino' + (opts.big ? ' big' : '') + (isDouble(tile) ? ' trump' : '');
  const half = v => {
    const on = new Set(PIP_PATTERNS[v]);
    let cells = '';
    for(let i=0;i<9;i++) cells += `<div class="pip ${on.has(i)?'on':''}"></div>`;
    return `<div class="domino-half">${cells}</div>`;
  };
  return `<div class="${cls}">${half(tile[0])}${half(tile[1])}</div>`;
}

/* =====================================================================
   Общее состояние процесса (и хоста, и клиента)
   ===================================================================== */
const Net = {
  peer: null,
  isHost: false,
  roomCode: null,
  myNickname: '',
  myId: null,
  hostConn: null,       // клиент -> host connection
};

/* ---------- HOST-only игровое состояние ---------- */
const Host = {
  players: [],          // {id, nickname, conn, isHost, hand, score, bid, tricksTaken, lastRoundScore}
  schedule: [],
  roundIndex: 0,
  firstBidderIndex: 0,
  biddingOrder: [], biddingTurnPtr: 0,
  playOrder: [], playTurnPtr: 0,
  trick: [],
  trickLeaderIndex: 0,
  tricksPlayedInRound: 0,
  lastTrickWinnerId: null,
  winnerId: null,
  phase: 'LOBBY',        // LOBBY | BIDDING | PLAYING | TRICK_RESULT | ROUND_RESULT | FINISHED
};

/* ---------- локальное состояние UI (и хоста, и клиента одинаково) ---------- */
let UI = {
  screen: 'start',       // start | lobby | game
  errorMsg: '',
  publicState: null,     // последнее полученное/построенное публичное состояние
  myHand: [],
};

/* =====================================================================
   HOST: построение публичного состояния и рассылка
   ===================================================================== */
function buildPublicState(){
  return {
    phase: Host.phase,
    roomCode: Net.roomCode,
    players: Host.players.map(p => ({
      id: p.id, nickname: p.nickname, score: p.score,
      bid: p.bid, tricksTaken: p.tricksTaken, handCount: p.hand.length,
      lastRoundScore: p.lastRoundScore
    })),
    handSize: Host.schedule[Host.roundIndex] || null,
    roundNumber: Host.roundIndex + 1,
    totalRounds: Host.schedule.length,
    firstBidderId: Host.players[Host.firstBidderIndex] ? Host.players[Host.firstBidderIndex].id : null,
    biddingTurnPlayerId: Host.phase==='BIDDING' ? (Host.players[Host.biddingOrder[Host.biddingTurnPtr]]||{}).id : null,
    playTurnPlayerId: Host.phase==='PLAYING' ? (Host.players[Host.playOrder[Host.playTurnPtr]]||{}).id : null,
    trick: Host.trick.map(e => ({ playerId: e.playerId, tile: e.tile })),
    lastTrickWinnerId: Host.lastTrickWinnerId,
    winnerId: Host.winnerId,
    errorMsg: null,
  };
}
function sendTo(player, msg){
  if(player.isHost){
    UI.publicState = msg.publicState;
    UI.myHand = msg.yourHand;
    UI.screen = 'game';
    render();
  } else if(player.conn && player.conn.open){
    player.conn.send(msg);
  }
}
function broadcastState(){
  const pub = buildPublicState();
  Host.players.forEach(p => sendTo(p, { type:'state', publicState: pub, yourHand: p.hand }));
}
function sendErrorTo(player, msg){
  if(player.isHost){ UI.errorMsg = msg; render(); }
  else if(player.conn && player.conn.open){ player.conn.send({type:'error', message: msg}); }
}

/* =====================================================================
   HOST: игровой процесс
   ===================================================================== */
function hostAddPlayer(id, nickname, conn){
  if(Host.phase !== 'LOBBY'){
    if(conn) conn.send({type:'error', message:'Игра уже началась — присоединиться нельзя.'});
    return;
  }
  if(Host.players.length >= 4){
    if(conn) conn.send({type:'error', message:'В комнате уже 4 игрока.'});
    return;
  }
  nickname = (nickname||'Игрок').trim().slice(0,18) || 'Игрок';
  Host.players.push({ id, nickname, conn: conn||null, isHost: !conn,
    hand:[], score:0, bid:null, tricksTaken:0, lastRoundScore:null });
  broadcastState();
}
function hostRemovePlayer(id){
  const idx = Host.players.findIndex(p=>p.id===id);
  if(idx===-1) return;
  Host.players.splice(idx,1);
  if(Host.phase !== 'LOBBY'){
    // упрощённо: игра продолжает без выбывшего игрока не поддерживается — оставляем как есть,
    // достаточно для игры с друзьями, которые не выходят посреди партии.
  }
  broadcastState();
}
function hostStartGame(){
  if(Host.players.length < 2){ sendErrorTo(Host.players.find(p=>p.isHost), 'Нужно минимум 2 игрока.'); return; }
  Host.schedule = buildSchedule(Host.players.length);
  Host.roundIndex = 0;
  Host.firstBidderIndex = 0;
  Host.players.forEach(p=>{ p.score = 0; p.lastRoundScore=null; });
  hostStartRound();
}
function hostStartRound(){
  const handSize = Host.schedule[Host.roundIndex];
  const deck = shuffle(allTiles());
  let idx = 0;
  Host.players.forEach(p=>{
    p.hand = deck.slice(idx, idx+handSize);
    idx += handSize;
    p.bid = null; p.tricksTaken = 0;
  });
  Host.phase = 'BIDDING';
  Host.biddingOrder = rotateOrder(Host.players.length, Host.firstBidderIndex);
  Host.biddingTurnPtr = 0;
  Host.trick = [];
  Host.lastTrickWinnerId = null;
  broadcastState();
}
function hostProcessBid(playerId, value){
  if(Host.phase !== 'BIDDING') return;
  const expIdx = Host.biddingOrder[Host.biddingTurnPtr];
  const p = Host.players[expIdx];
  if(!p || p.id !== playerId) return;
  const handSize = Host.schedule[Host.roundIndex];
  value = Number(value);
  if(!Number.isInteger(value) || value<0 || value>handSize) return;
  p.bid = value;
  Host.biddingTurnPtr++;
  if(Host.biddingTurnPtr >= Host.players.length){
    Host.phase = 'PLAYING';
    Host.trickLeaderIndex = Host.firstBidderIndex;
    Host.tricksPlayedInRound = 0;
    Host.trick = [];
    Host.playOrder = rotateOrder(Host.players.length, Host.trickLeaderIndex);
    Host.playTurnPtr = 0;
  }
  broadcastState();
}
function hostProcessPlay(playerId, tile){
  if(Host.phase !== 'PLAYING') return;
  const expIdx = Host.playOrder[Host.playTurnPtr];
  const p = Host.players[expIdx];
  if(!p || p.id !== playerId) return;
  const hIdx = p.hand.findIndex(t => t[0]===tile[0] && t[1]===tile[1]);
  if(hIdx === -1) return;
  p.hand.splice(hIdx,1);
  Host.trick.push({ playerId, playerIndex: expIdx, tile, playIndex: Host.trick.length });
  Host.playTurnPtr++;
  if(Host.playTurnPtr >= Host.players.length){
    Host.phase = 'TRICK_RESULT';
    const winnerEntry = findTrickWinner(Host.trick);
    const winnerPlayer = Host.players[winnerEntry.playerIndex];
    winnerPlayer.tricksTaken++;
    Host.lastTrickWinnerId = winnerPlayer.id;
    broadcastState();
    setTimeout(hostAfterTrickResult, 1900);
  } else {
    broadcastState();
  }
}
function hostAfterTrickResult(){
  const winnerEntry = findTrickWinner(Host.trick);
  Host.tricksPlayedInRound++;
  Host.trick = [];
  const handSize = Host.schedule[Host.roundIndex];
  if(Host.tricksPlayedInRound >= handSize){
    hostFinishRound();
  } else {
    Host.trickLeaderIndex = winnerEntry.playerIndex;
    Host.playOrder = rotateOrder(Host.players.length, Host.trickLeaderIndex);
    Host.playTurnPtr = 0;
    Host.phase = 'PLAYING';
    broadcastState();
  }
}
function hostFinishRound(){
  Host.phase = 'ROUND_RESULT';
  Host.players.forEach(p=>{
    let rs;
    if(p.bid === 0 && p.tricksTaken === 0) rs = 5;
    else if(p.bid > 0 && p.tricksTaken === p.bid) rs = 10*p.bid;
    else if(p.tricksTaken > p.bid) rs = p.tricksTaken;
    else rs = -10*p.bid;
    p.lastRoundScore = rs;
    p.score += rs;
  });
  broadcastState();
  setTimeout(hostAfterRoundResult, 2800);
}
function hostAfterRoundResult(){
  Host.roundIndex++;
  Host.firstBidderIndex = (Host.firstBidderIndex+1) % Host.players.length;
  if(Host.roundIndex >= Host.schedule.length){
    hostCheckGameEnd();
  } else {
    hostStartRound();
  }
}
function hostCheckGameEnd(){
  const maxScore = Math.max(...Host.players.map(p=>p.score));
  const leaders = Host.players.filter(p=>p.score===maxScore);
  if(leaders.length === 1){
    Host.phase = 'FINISHED';
    Host.winnerId = leaders[0].id;
    broadcastState();
  } else {
    Host.schedule.push(6);
    hostStartRound();
  }
}
function hostRestart(){
  Host.phase = 'LOBBY';
  Host.players.forEach(p=>{ p.score=0; p.bid=null; p.tricksTaken=0; p.hand=[]; p.lastRoundScore=null; });
  Host.winnerId = null; Host.lastTrickWinnerId = null; Host.trick=[];
  broadcastState();
}

/* =====================================================================
   PeerJS wiring
   ===================================================================== */
function hostHandleData(conn, data){
  if(data.type === 'join'){
    hostAddPlayer(conn.peer, data.nickname, conn);
  } else if(data.type === 'bid'){
    hostProcessBid(conn.peer, data.value);
  } else if(data.type === 'playTile'){
    hostProcessPlay(conn.peer, data.tile);
  }
}
function createRoom(nickname){
  UI.errorMsg = '';
  Net.isHost = true;
  Net.myNickname = nickname;
  Net.roomCode = randomRoomCode();
  Net.peer = new Peer(Net.roomCode, { debug: 0 });
  Net.peer.on('open', id => {
    Net.myId = id;
    hostAddPlayer(id, nickname, null); // host сам как игрок
    UI.screen = 'lobby';
    render();
  });
  Net.peer.on('connection', conn => {
    conn.on('data', data => hostHandleData(conn, data));
    conn.on('close', () => hostRemovePlayer(conn.peer));
  });
  Net.peer.on('error', err => {
    UI.errorMsg = 'Ошибка соединения: ' + (err && err.type ? err.type : err);
    render();
  });
}
function joinRoom(nickname, code){
  UI.errorMsg = '';
  Net.isHost = false;
  Net.myNickname = nickname;
  Net.roomCode = code.trim().toUpperCase();
  Net.peer = new Peer({ debug: 0 });
  Net.peer.on('open', id => {
    Net.myId = id;
    const conn = Net.peer.connect(Net.roomCode, { reliable: true });
    Net.hostConn = conn;
    conn.on('open', () => {
      conn.send({ type:'join', nickname });
      UI.screen = 'lobby';
      render();
    });
    conn.on('data', data => {
      if(data.type === 'state'){
        UI.publicState = data.publicState;
        UI.myHand = data.yourHand;
        UI.screen = 'game';
        UI.errorMsg = '';
      } else if(data.type === 'error'){
        UI.errorMsg = data.message;
      }
      render();
    });
    conn.on('close', () => { UI.errorMsg = 'Соединение с хостом потеряно.'; render(); });
  });
  Net.peer.on('error', err => {
    UI.errorMsg = 'Не удалось подключиться: ' + (err && err.type ? err.type : err);
    render();
  });
}
function sendAction(msg){
  if(Net.isHost){
    if(msg.type === 'bid') hostProcessBid(Net.myId, msg.value);
    else if(msg.type === 'playTile') hostProcessPlay(Net.myId, msg.tile);
  } else if(Net.hostConn && Net.hostConn.open){
    Net.hostConn.send(msg);
  }
}

/* =====================================================================
   RENDER
   ===================================================================== */
const appEl = document.getElementById('app');

function render(){
  if(UI.screen === 'start') return renderStart();
  if(UI.screen === 'lobby') return renderLobby();
  if(UI.screen === 'game') return renderGame();
}

function renderStart(){
  appEl.innerHTML = `
    <div class="brand"><div class="display">TRICKO</div><div class="sub">домино на взятки</div></div>
    <div class="panel">
      <label for="nick">Ваш никнейм</label>
      <input type="text" id="nick" placeholder="Например, Кирилл" maxlength="18">
      <div class="row" style="margin-top:16px;">
        <button class="btn-gold" id="btnCreate">Создать комнату</button>
        <button class="btn-ghost" id="btnShowJoin">Войти по коду</button>
      </div>
      <div id="joinBlock" style="display:none; margin-top:16px;">
        <label for="code">Код комнаты</label>
        <input type="text" id="code" placeholder="TRK-XXXXX" maxlength="12">
        <button class="btn-gold" id="btnJoin" style="margin-top:12px; width:100%;">Присоединиться</button>
      </div>
      ${UI.errorMsg ? `<div class="error-box">${escapeHtml(UI.errorMsg)}</div>` : ''}
      <p class="hint" style="margin-top:16px;">2–4 игрока. Один создаёт комнату и делится кодом, остальные вводят его, чтобы присоединиться.</p>
    </div>
    <div class="footer-note">28 костей домино · козыри — дубли · побеждает точный расчёт взяток</div>
  `;
  document.getElementById('btnShowJoin').onclick = () => {
    document.getElementById('joinBlock').style.display = 'block';
  };
  document.getElementById('btnCreate').onclick = () => {
    const nick = document.getElementById('nick').value.trim() || 'Игрок';
    createRoom(nick);
  };
  document.getElementById('btnJoin').onclick = () => {
    const nick = document.getElementById('nick').value.trim() || 'Игрок';
    const code = document.getElementById('code').value.trim();
    if(!code){ UI.errorMsg = 'Введите код комнаты.'; render(); return; }
    joinRoom(nick, code);
  };
}

function renderLobby(){
  const pub = UI.publicState;
  const players = pub ? pub.players : (Net.isHost ? Host.players : []);
  const canStart = Net.isHost && players.length >= 2;
  appEl.innerHTML = `
    <div class="brand"><div class="display">TRICKO</div><div class="sub">лобби</div></div>
    <div class="panel">
      <div class="code-display">${Net.roomCode}</div>
      <p class="hint" style="text-align:center;">Поделитесь этим кодом с друзьями — им нужно нажать «Войти по коду» и ввести его.</p>
      <div class="player-chip-list" id="chipList"></div>
      ${UI.errorMsg ? `<div class="error-box">${escapeHtml(UI.errorMsg)}</div>` : ''}
      ${Net.isHost
        ? `<button class="btn-gold" id="btnStart" style="width:100%; margin-top:12px;" ${canStart?'':'disabled'}>
             ${canStart ? 'Начать игру' : 'Нужно минимум 2 игрока'}
           </button>`
        : `<p class="hint" style="text-align:center; margin-top:10px;">Ожидание хоста, чтобы начать игру…</p>`
      }
    </div>
  `;
  const chipList = document.getElementById('chipList');
  const names = Net.isHost ? Host.players.map(p=>p.nickname) : players.map(p=>p.nickname);
  chipList.innerHTML = names.map((n,i)=>`<div class="player-chip">${escapeHtml(n)} ${i===0?'<span class="tag">хост</span>':''}</div>`).join('');
  if(Net.isHost){
    const btn = document.getElementById('btnStart');
    if(btn) btn.onclick = hostStartGame;
  }
}

function renderGame(){
  const s = UI.publicState;
  if(!s){ appEl.innerHTML = '<div class="panel">Загрузка…</div>'; return; }
  const phaseLabel = {
    BIDDING: 'Торги', PLAYING: 'Розыгрыш', TRICK_RESULT: 'Итог взятки',
    ROUND_RESULT: 'Итог раунда', FINISHED: 'Игра завершена'
  }[s.phase] || s.phase;

  let html = `
    <div class="topbar">
      <div class="room">Комната ${s.roomCode} · раунд ${s.roundNumber}/${s.totalRounds}${s.handSize?` · по ${s.handSize} костей`:''}</div>
      <div class="phase">${phaseLabel}</div>
    </div>
    <div class="board">
      ${s.players.map(p => renderSeat(p, s)).join('')}
    </div>
  `;

  if(s.phase === 'PLAYING' || s.phase === 'TRICK_RESULT'){
    html += renderTrickArea(s);
  }

  if(s.phase === 'BIDDING'){
    html += renderBiddingArea(s);
  } else if(s.phase === 'PLAYING'){
    html += renderHandArea(s, true);
  } else if(s.phase === 'TRICK_RESULT'){
    const winnerName = (s.players.find(p=>p.id===s.lastTrickWinnerId)||{}).nickname || '';
    html += `<div class="center-note">Взятку берёт <b>${escapeHtml(winnerName)}</b></div>`;
    html += renderHandArea(s, false);
  } else if(s.phase === 'ROUND_RESULT'){
    html += renderRoundResult(s);
  } else if(s.phase === 'FINISHED'){
    html += renderFinished(s);
  }

  if(UI.errorMsg){
    html += `<div class="error-box">${escapeHtml(UI.errorMsg)}</div>`;
  }

  appEl.innerHTML = html;
  wireGameHandlers(s);
}

function renderSeat(p, s){
  const isYou = p.id === Net.myId;
  const isActive = (s.phase==='BIDDING' && p.id===s.biddingTurnPlayerId) ||
                    (s.phase==='PLAYING' && p.id===s.playTurnPlayerId);
  const bidStr = p.bid===null ? '—' : p.bid;
  let lastRound = '';
  if(p.lastRoundScore !== null && p.lastRoundScore !== undefined && (s.phase==='ROUND_RESULT' || s.phase==='FINISHED')){
    const sign = p.lastRoundScore > 0 ? '+' : '';
    lastRound = `<div class="last-round ${p.lastRoundScore>=0?'pos':'neg'}">${sign}${p.lastRoundScore} за раунд</div>`;
  }
  return `
    <div class="seat ${isActive?'active':''} ${isYou?'you':''}">
      <div class="name">${escapeHtml(p.nickname)}</div>
      <div class="score">${p.score}</div>
      <div class="stat-line"><span>СТАВКА: <b>${bidStr}</b></span><span>ВЗЯТО: <b>${p.tricksTaken}</b></span></div>
      ${lastRound}
    </div>
  `;
}

function renderTrickArea(s){
  if(s.trick.length === 0){
    return `<div class="trick-area"><div class="trick-empty">Взятка ещё не начата</div></div>`;
  }
  const slots = s.trick.map(e => {
    const name = (s.players.find(p=>p.id===e.playerId)||{}).nickname || '';
    return `<div class="trick-slot"><div class="who">${escapeHtml(name)}</div>${renderTileHTML(e.tile,{big:true})}</div>`;
  }).join('');
  return `<div class="trick-area">${slots}</div>`;
}

function renderBiddingArea(s){
  const myTurn = s.biddingTurnPlayerId === Net.myId;
  const handSize = s.handSize;
  if(!myTurn){
    const name = (s.players.find(p=>p.id===s.biddingTurnPlayerId)||{}).nickname || '';
    return `<div class="panel"><div class="center-note">Ставку делает <b>${escapeHtml(name)}</b>…</div>${renderMyHandStrip()}</div>`;
  }
  let opts = '';
  for(let i=0;i<=handSize;i++) opts += `<button class="bid-btn" data-bid="${i}">${i}</button>`;
  return `<div class="panel"><div class="center-note">Ваша ставка — сколько взяток возьмёте?</div><div class="bid-grid">${opts}</div>${renderMyHandStrip()}</div>`;
}

function renderMyHandStrip(){
  if(!UI.myHand || UI.myHand.length===0) return '';
  return `<div class="hand-row" style="margin-top:14px; opacity:0.85;">
    ${UI.myHand.map(t=>renderTileHTML(t)).join('')}
  </div>`;
}

function renderHandArea(s, interactive){
  const myTurn = interactive && s.playTurnPlayerId === Net.myId;
  const tiles = UI.myHand.map((t,i) => {
    const disabled = !myTurn;
    return `<button class="hand-tile-btn" data-idx="${i}" ${disabled?'disabled':''}>${renderTileHTML(t,{big:true})}</button>`;
  }).join('');
  const label = interactive
    ? (myTurn ? 'Ваш ход — выберите кость' : `Ходит ${escapeHtml((s.players.find(p=>p.id===s.playTurnPlayerId)||{}).nickname||'')}…`)
    : 'Ваши кости';
  return `<div class="panel"><div class="center-note">${label}</div><div class="hand-row">${tiles}</div></div>`;
}

function renderRoundResult(s){
  const rows = s.players.map(p => {
    const sign = p.lastRoundScore>0?'+':'';
    return `<tr><td>${escapeHtml(p.nickname)}</td><td>${p.bid}</td><td>${p.tricksTaken}</td><td>${sign}${p.lastRoundScore}</td><td><b>${p.score}</b></td></tr>`;
  }).join('');
  return `<div class="panel">
    <h3>Итоги раунда ${s.roundNumber}</h3>
    <table class="result-table">
      <tr><th>Игрок</th><th>Ставка</th><th>Взято</th><th>Очки за раунд</th><th>Всего</th></tr>
      ${rows}
    </table>
    <p class="hint" style="margin-top:10px;">Следующий раунд начнётся автоматически…</p>
  </div>`;
}

function renderFinished(s){
  const winner = s.players.find(p=>p.id===s.winnerId);
  const sorted = s.players.slice().sort((a,b)=>b.score-a.score);
  const rows = sorted.map(p => `<tr><td>${escapeHtml(p.nickname)}</td><td><b>${p.score}</b></td></tr>`).join('');
  return `<div class="panel">
    <div class="final-winner">
      <div class="hint">Победитель</div>
      <div class="display">${escapeHtml(winner ? winner.nickname : '')}</div>
    </div>
    <table class="result-table">
      <tr><th>Игрок</th><th>Итоговый счёт</th></tr>
      ${rows}
    </table>
    ${Net.isHost ? `<button class="btn-gold" id="btnRematch" style="width:100%; margin-top:14px;">Сыграть ещё раз</button>` : `<p class="hint" style="text-align:center; margin-top:14px;">Ожидание хоста для новой игры…</p>`}
  </div>`;
}

function wireGameHandlers(s){
  document.querySelectorAll('.bid-btn').forEach(btn=>{
    btn.onclick = () => sendAction({ type:'bid', value: Number(btn.dataset.bid) });
  });
  document.querySelectorAll('.hand-tile-btn').forEach(btn=>{
    btn.onclick = () => {
      if(btn.disabled) return;
      const idx = Number(btn.dataset.idx);
      const tile = UI.myHand[idx];
      sendAction({ type:'playTile', tile });
    };
  });
  const rematchBtn = document.getElementById('btnRematch');
  if(rematchBtn) rematchBtn.onclick = () => { hostRestart(); };
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

render();
</script>
</body>
</html>
