<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRICKO — Domino</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f1e9;
    color: #222;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* HOME */

.screen {
    min-height: 100vh;
}

.home {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.home-card {
    width: 100%;
    max-width: 420px;
    background: white;
    border-radius: 24px;
    padding: 32px 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,.08);
    text-align: center;
}

.logo {
    font-size: 56px;
    margin-bottom: 8px;
}

.home-title {
    font-size: 34px;
    font-weight: 900;
    margin-bottom: 6px;
}

.home-subtitle {
    color: #777;
    margin-bottom: 28px;
}

.input {
    width: 100%;
    height: 52px;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 0 16px;
    outline: none;
    margin-bottom: 12px;
}

.input:focus {
    border-color: #236b42;
}

.btn {
    width: 100%;
    min-height: 50px;
    border: 0;
    border-radius: 12px;
    padding: 12px 18px;
    font-weight: 800;
    background: #236b42;
    color: white;
    margin-bottom: 10px;
}

.btn.secondary {
    background: #eeeae1;
    color: #222;
}

.btn.small {
    width: auto;
    min-height: 40px;
    margin: 0;
    padding: 8px 14px;
}

.home-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 15px 0;
    color: #aaa;
    font-size: 13px;
}

.home-divider:before,
.home-divider:after {
    content: "";
    height: 1px;
    background: #eee;
    flex: 1;
}

/* LOBBY */

.lobby {
    padding: 20px;
}

.lobby-card {
    max-width: 600px;
    margin: 30px auto;
    background: white;
    border-radius: 22px;
    padding: 24px;
}

.lobby-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 20px;
}

.lobby-title {
    font-size: 25px;
    font-weight: 900;
}

.room-code {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #f3f0e8;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 20px;
}

.room-code-value {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 3px;
}

.players-title {
    font-weight: 800;
    margin-bottom: 10px;
}

.player-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    background: #f8f7f3;
    border-radius: 10px;
    margin-bottom: 8px;
}

.player-name {
    font-weight: 700;
}

.host-label {
    font-size: 11px;
    color: #236b42;
    font-weight: 800;
}

.lobby-status {
    margin: 20px 0;
    padding: 14px;
    background: #f3f0e8;
    border-radius: 12px;
    text-align: center;
    color: #666;
}

/* GAME */

.game {
    min-height: 100vh;
    padding-bottom: 30px;
}

.game-header {
    background: white;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.game-title {
    font-size: 21px;
    font-weight: 900;
}

.round-label {
    font-size: 13px;
    color: #777;
}

.game-main {
    max-width: 760px;
    margin: 0 auto;
    padding: 12px;
}

/* SCORE */

.scoreboard {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 12px;
}

.score-player {
    background: white;
    border-radius: 12px;
    padding: 10px;
    min-width: 0;
}

.score-player.me {
    border: 2px solid #236b42;
}

.score-player-name {
    font-weight: 800;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.score {
    font-size: 22px;
    font-weight: 900;
    margin-top: 5px;
}

.small {
    font-size: 11px;
    color: #888;
}

/* TABLE */

.table {
    background: #236b42;
    border-radius: 22px;
    min-height: 310px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 0 4px rgba(255,255,255,.04);
}

.table-message {
    color: white;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 18px;
}

.trick {
    min-height: 170px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

/* DOMINO */

.domino {
    width: 58px;
    height: 112px;
    background: white;
    border-radius: 9px;
    border: 1px solid #ccc;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 3px 7px rgba(0,0,0,.2);
    flex-shrink: 0;
}

.domino-half {
    height: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.domino-half:first-child {
    border-bottom: 1px solid #bbb;
}

.domino-pips {
    position: relative;
    width: 38px;
    height: 38px;
}

.pip {
    width: 7px;
    height: 7px;
    background: #222;
    border-radius: 50%;
    position: absolute;
}

.p1 { left: 0; top: 0; }
.p2 { left: 50%; top: 0; transform: translateX(-50%); }
.p3 { right: 0; top: 0; }
.p4 { left: 0; top: 50%; transform: translateY(-50%); }
.p5 { left: 50%; top: 50%; transform: translate(-50%, -50%); }
.p6 { right: 0; top: 50%; transform: translateY(-50%); }
.p7 { left: 0; bottom: 0; }
.p8 { left: 50%; bottom: 0; transform: translateX(-50%); }
.p9 { right: 0; bottom: 0; }

.hand {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding: 14px 2px 8px;
    justify-content: center;
}

.hand .domino {
    cursor: pointer;
    transition: transform .15s;
}

.hand .domino:hover {
    transform: translateY(-5px);
}

.hand .domino.disabled {
    opacity: .4;
    cursor: default;
}

/* STATS */

.info-panel {
    margin-top: 12px;
}

.player-stats {
    background: white;
    border-radius: 16px;
    padding: 14px;
}

.player-stats-title {
    font-weight: 800;
    margin-bottom: 10px;
}

.player-stat {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 8px;
    border-bottom: 1px solid #eee;
}

.player-stat:last-child {
    border-bottom: 0;
}

.player-stat.current {
    background: #f3f0e8;
    border-radius: 10px;
}

.player-stat-left {
    min-width: 0;
}

.player-stat-name {
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.player-stat-status {
    font-size: 11px;
    color: #888;
    margin-top: 2px;
}

.player-stat-right {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
}

.stat-badge {
    padding: 5px 8px;
    border-radius: 7px;
    background: #eeeae1;
    font-size: 12px;
    white-space: nowrap;
}

.stat-badge.bid {
    font-weight: 800;
}

.stat-badge.tricks {
    background: #236b42;
    color: white;
    font-weight: 800;
}

.stat-badge.pending {
    color: #888;
    font-weight: 400;
}

/* BIDS */

.bid-area {
    background: white;
    border-radius: 16px;
    padding: 14px;
    margin-top: 12px;
}

.bid-title {
    font-weight: 800;
    margin-bottom: 10px;
    text-align: center;
}

.bid-buttons {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 7px;
}

.bid-button {
    border: 0;
    background: #eeeae1;
    border-radius: 9px;
    min-height: 42px;
    font-weight: 900;
}

.bid-button:hover {
    background: #236b42;
    color: white;
}

.waiting {
    text-align: center;
    color: #777;
    padding: 10px;
}

/* RESULT */

.result {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.result-card {
    width: 100%;
    max-width: 500px;
    background: white;
    border-radius: 24px;
    padding: 30px 22px;
    text-align: center;
}

.result-trophy {
    font-size: 60px;
}

.result-title {
    font-size: 30px;
    font-weight: 900;
    margin: 10px 0;
}

.result-winner {
    font-size: 20px;
    font-weight: 800;
    color: #236b42;
    margin-bottom: 20px;
}

.final-player {
    display: flex;
    justify-content: space-between;
    padding: 12px;
    border-bottom: 1px solid #eee;
}

.final-player-name {
    font-weight: 700;
}

/* TOAST */

.toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    background: #222;
    color: white;
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 14px;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
}

.toast.show {
    opacity: 1;
}

/* MOBILE */

@media (max-width: 600px) {

    .home-card {
        padding: 26px 18px;
    }

    .scoreboard {
        grid-template-columns: repeat(2, 1fr);
    }

    .table {
        min-height: 260px;
    }

    .trick {
        min-height: 130px;
    }

    .domino {
        width: 50px;
        height: 96px;
    }

    .hand {
        justify-content: flex-start;
    }

    .player-stat {
        padding: 9px 4px;
    }

    .player-stat-right {
        gap: 4px;
    }

    .stat-badge {
        padding: 4px 6px;
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div id="homeScreen" class="screen home">
    <div class="home-card">

<div id="toast" class="toast"></div>


<script>

/* =========================================================
   STATE
========================================================= */

let peer = null;
let isHost = false;

let roomCode = "";
let myId = "";

let connections = {};

let game = null;

let lobbyStartTimer = null;


/* =========================================================
   HELPERS
========================================================= */

function $(id) {
    return document.getElementById(id);
}


function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function toast(text) {

    const el = $("toast");

    el.textContent = text;

    el.classList.add("show");

    clearTimeout(el._timer);

    el._timer = setTimeout(() => {
        el.classList.remove("show");
    }, 2500);
}


function showScreen(id) {

    [
        "homeScreen",
        "lobbyScreen",
        "gameScreen",
        "resultScreen"
    ].forEach(screen => {
        $(screen).classList.add("hidden");
    });

    $(id).classList.remove("hidden");
}


/* =========================================================
   NICKNAME
========================================================= */

$("nickname").value =
    localStorage.getItem(
        "tricko_nickname"
    ) || "";


/* =========================================================
   ROOM CODE
========================================================= */

function randomRoomCode() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for (let i = 0; i < 5; i++) {

        result += chars[
            Math.floor(
                Math.random() * chars.length
            )
        ];
    }

    return result;
}


/* =========================================================
   DECK
========================================================= */

function createDeck() {

    const deck = [];

    let id = 0;

    for (let a = 0; a <= 6; a++) {

        for (let b = a; b <= 6; b++) {

            deck.push({
                id: id++,
                a,
                b
            });

        }
    }

    return deck;
}


function shuffle(array) {

    const result = [...array];

    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            result[i],
            result[j]
        ] = [
            result[j],
            result[i]
        ];
    }

    return result;
}


/* =========================================================
   TILE STRENGTH
========================================================= */

function isTrump(tile) {

    return tile.a === tile.b;
}


function trumpRank(tile) {

    if (!isTrump(tile))
        return 0;

    return {
        1: 7,
        2: 6,
        3: 5,
        4: 4,
        5: 3,
        6: 2,
        0: 1
    }[tile.a];
}


function tileStrength(tile) {

    if (isTrump(tile)) {

        return 100 +
            trumpRank(tile);
    }

    return tile.a + tile.b;
}


/*
    При одинаковой силе побеждает
    тот, кто сыграл раньше.
*/

function compareTiles(newTile, oldTile) {

    return tileStrength(newTile) >
        tileStrength(oldTile);
}


/* =========================================================
   ROUND SEQUENCE
========================================================= */

function getRoundSizes(playerCount) {

    return [
        1, 2, 3, 4, 5,

        ...Array(playerCount).fill(6),

        5, 4, 3, 2, 1,

        6
    ];
}


/* =========================================================
   GAME STATE
========================================================= */

function createGameState() {

    return {

        players: [],

        roundIndex: 0,
        roundTotal: 0,

        phase: "lobby",

        firstBidder: 0,
        currentPlayer: 0,

        trick: [],
        trickNumber: 0,

        lastTrickWinner: null,

        winner: null

    };
}


/* =========================================================
   PUBLIC STATE
========================================================= */

function publicGameState() {

    return {

        players:
            game.players.map(player => ({

                id: player.id,
                nick: player.nick,

                score: player.score,
                roundScore:
                    player.roundScore,

                bid: player.bid,
                tricks: player.tricks,

                connected:
                    player.connected,

                handCount:
                    player.hand.length

            })),

        roundIndex:
            game.roundIndex,

        roundTotal:
            game.roundTotal,

        phase:
            game.phase,

        firstBidder:
            game.firstBidder,

        currentPlayer:
            game.currentPlayer,

        trick:
            game.trick,

        trickNumber:
            game.trickNumber,

        lastTrickWinner:
            game.lastTrickWinner,

        winner:
            game.winner
    };
}


/* =========================================================
   SEND STATE
========================================================= */

/*
    КРИТИЧЕСКОЕ ИСПРАВЛЕНИЕ:

    Раньше здесь состояние хоста заменялось
    publicGameState(), из-за чего хост терял руки.

    Теперь хост НЕ получает public state обратно.

    Хост хранит полное авторитетное состояние.
*/

function sendFullState() {

    if (!isHost || !game)
        return;

    const publicState =
        publicGameState();

    game.players.forEach(
        player => {

            if (
                player.id === myId
            ) {

                /*
                    Ничего не перезаписываем.

                    У хоста уже есть:

                    game.players[i].hand

                    и это настоящее состояние игры.
                */

                render();

                return;
            }

            const conn =
                connections[player.id];

            if (
                conn &&
                conn.open
            ) {

                conn.send({

                    type: "state",

                    game: publicState,

                    myHand:
                        player.hand,

                    myId:
                        player.id
                });
            }
        }
    );

    render();
}


/* =========================================================
   CLIENT STATE
========================================================= */

function receiveState(payload) {

    if (
        !payload ||
        !payload.game
    ) {
        return;
    }

    /*
        Для клиента сохраняем только
        публичную часть + свою руку.
    */

    game = {

        ...payload.game,

        myHand:
            Array.isArray(payload.myHand)
                ? payload.myHand
                : (
                    game?.myHand || []
                )
    };

    myId =
        payload.myId ||
        myId;

    render();
}


/* =========================================================
   START ROUND
========================================================= */

function startRound() {

    if (!isHost)
        return;

    const count =
        game.players.length;

    const rounds =
        getRoundSizes(count);

    game.roundTotal =
        rounds.length;

    const handSize =
        rounds[
            game.roundIndex
        ] || 6;

    game.firstBidder =
        game.roundIndex % count;

    game.currentPlayer =
        game.firstBidder;

    game.phase =
        "bidding";

    game.trick = [];

    game.trickNumber = 0;

    game.lastTrickWinner =
        null;

    const deck =
        shuffle(createDeck());

    game.players.forEach(
        player => {

            player.hand =
                deck.splice(
                    0,
                    handSize
                );

            player.bid = null;

            player.tricks = 0;

            player.roundScore = 0;
        }
    );

    sendFullState();

    toast(
        `Раунд ${game.roundIndex + 1}: сделайте ставку`
    );
}


/* =========================================================
   BIDDING
========================================================= */

function hostReceiveBid(
    playerId,
    value
) {

    if (
        !isHost ||
        !game ||
        game.phase !== "bidding"
    ) {
        return;
    }

    const index =
        game.players.findIndex(
            player =>
                player.id === playerId
        );

    if (index === -1)
        return;

    if (
        index !==
        game.currentPlayer
    ) {
        return;
    }

    const player =
        game.players[index];

    value =
        Number(value);

    if (
        !Number.isInteger(value) ||
        value < 0 ||
        value > player.hand.length
    ) {
        return;
    }

    player.bid = value;

    /*
        Находим следующего,
        кто ещё не ставил.
    */

    const next =
        game.players.findIndex(
            player =>
                player.bid === null
        );

    if (next === -1) {

        /*
            Все ставки сделаны.

            Важно: сначала отправляем
            состояние со всеми ставками,
            затем начинаем игру.
        */

        sendFullState();

        setTimeout(() => {

            startTrickPlay();

        }, 250);

        return;
    }

    game.currentPlayer =
        next;

    /*
        Здесь новая ставка сразу
        появляется у всех.
    */

    sendFullState();
}


/* =========================================================
   START PLAY
========================================================= */

function startTrickPlay() {

    if (!isHost)
        return;

    game.phase =
        "playing";

    game.trick = [];

    game.trickNumber = 0;

    game.currentPlayer =
        game.firstBidder;

    sendFullState();
}


/* =========================================================
   PLAY
========================================================= */

function hostReceivePlay(
    playerId,
    tileId
) {

    if (
        !isHost ||
        !game ||
        game.phase !== "playing"
    ) {
        return;
    }

    const playerIndex =
        game.players.findIndex(
            player =>
                player.id === playerId
        );

    if (playerIndex === -1)
        return;

    if (
        playerIndex !==
        game.currentPlayer
    ) {
        return;
    }

    const player =
        game.players[playerIndex];

    const tileIndex =
        player.hand.findIndex(
            tile =>
                tile.id === tileId
        );

    if (tileIndex === -1)
        return;

    const tile =
        player.hand[tileIndex];

    player.hand.splice(
        tileIndex,
        1
    );

    game.trick.push({

        playerIndex,

        tile
    });

    /*
        Все сходили.
    */

    if (
        game.trick.length ===
        game.players.length
    ) {

        resolveTrick();

        return;
    }

    game.currentPlayer =
        (
            game.currentPlayer + 1
        ) %
        game.players.length;

    sendFullState();
}


/* =========================================================
   TRICK RESULT
========================================================= */

function resolveTrick() {

    if (
        !game.trick.length
    ) {
        return;
    }

    let winner =
        game.trick[0];

    for (
        let i = 1;
        i < game.trick.length;
        i++
    ) {

        const candidate =
            game.trick[i];

        if (
            compareTiles(
                candidate.tile,
                winner.tile
            )
        ) {

            winner =
                candidate;
        }
    }

    game.players[
        winner.playerIndex
    ].tricks++;

    game.lastTrickWinner =
        winner.playerIndex;

    game.currentPlayer =
        winner.playerIndex;

    game.trickNumber++;

    game.phase =
        "trickResult";

    /*
        Здесь у всех обновляется "Взял".
    */

    sendFullState();

    setTimeout(() => {

        const cardsRemain =
            game.players.some(
                player =>
                    player.hand.length > 0
            );

        if (!cardsRemain) {

            finishRound();

            return;
        }

        game.trick = [];

        game.phase =
            "playing";

        sendFullState();

    }, 1300);
}


/* =========================================================
   SCORE
========================================================= */

function calculateRoundScore(
    player
) {

    const bid =
        player.bid;

    const tricks =
        player.tricks;

    if (
        bid === 0 &&
        tricks === 0
    ) {
        return 5;
    }

    if (
        bid > 0 &&
        tricks === bid
    ) {
        return 10 * bid;
    }

    if (
        tricks > bid
    ) {
        return tricks;
    }

    return -10 * bid;
}


/* =========================================================
   FINISH ROUND
========================================================= */

function finishRound() {

    game.phase =
        "roundResult";

    game.players.forEach(
        player => {

            player.roundScore =
                calculateRoundScore(
                    player
                );

            player.score +=
                player.roundScore;
        }
    );

    sendFullState();

    setTimeout(() => {

        if (
            game.roundIndex + 1 <
            game.roundTotal
        ) {

            game.roundIndex++;

            startRound();

        } else {

            finishCycle();
        }

    }, 2200);
}


/* =========================================================
   FINISH CYCLE / TIE
========================================================= */

function finishCycle() {

    const maxScore =
        Math.max(
            ...game.players.map(
                player =>
                    player.score
            )
        );

    const leaders =
        game.players.filter(
            player =>
                player.score ===
                maxScore
        );

    if (
        leaders.length === 1
    ) {

        game.phase =
            "finished";

        game.winner =
            leaders[0].id;

        sendFullState();

        return;
    }

    /*
        Ничья.

        Дополнительный кон на 6 карт.
    */

    game.roundIndex++;

    game.roundTotal =
        game.roundIndex + 1;

    game.firstBidder =
        (
            game.roundIndex - 1
        ) %
        game.players.length;

    game.currentPlayer =
        game.firstBidder;

    game.phase =
        "bidding";

    game.trick = [];

    game.trickNumber = 0;

    game.lastTrickWinner =
        null;

    const deck =
        shuffle(createDeck());

    game.players.forEach(
        player => {

            player.hand =
                deck.splice(0, 6);

            player.bid = null;

            player.tricks = 0;

            player.roundScore = 0;
        }
    );

    sendFullState();

    toast(
        "Ничья! Дополнительный кон на 6 карт"
    );
}

/* =========================================================
   DOMINO
========================================================= */

function renderDomino(tile) {

    return `

        <div class="domino">

            <div class="domino-half">
                ${renderPips(tile.a)}
            </div>

            <div class="domino-half">
                ${renderPips(tile.b)}
            </div>

        </div>

    `;
}


function renderPips(number) {

    const positions = {

        1: ["p5"],
        2: ["p1","p9"],
        3: ["p1","p5","p9"],
        4: ["p1","p3","p7","p9"],
        5: ["p1","p3","p5","p7","p9"],
        6: ["p1","p3","p4","p6","p7","p9"]

    };

    if (number === 0) {

        return `
            <div class="domino-pips"></div>
        `;
    }

    return `

        <div class="domino-pips">

            ${
                positions[number]
                    .map(
                        position =>
                            `<span class="pip ${position}"></span>`
                    )
                    .join("")
            }

        </div>

    `;
}

/* =========================================================
   BID
========================================================= */

function makeBid(value) {

    if (
        !game ||
        game.phase !== "bidding"
    ) {
        return;
    }

    const current =
        game.players[
            game.currentPlayer
        ];

    if (
        !current ||
        current.id !== myId
    ) {
        return;
    }

    if (isHost) {

        hostReceiveBid(
            myId,
            value
        );

    } else {

        sendToHost({

            type: "bid",

            value
        });
    }
}


/* =========================================================
   PLAY TILE
========================================================= */

function playTile(tileId) {

    if (
        !game ||
        game.phase !== "playing"
    ) {
        return;
    }

    const current =
        game.players[
            game.currentPlayer
        ];

    if (
        !current ||
        current.id !== myId
    ) {
        return;
    }

    if (isHost) {

        hostReceivePlay(
            myId,
            tileId
        );

    } else {

        sendToHost({

            type: "play",

            tileId
        });
    }
}


/* =========================================================
   HOST PEER
========================================================= */

function createHostPeer() {

    const peerId =
        "domino-" +
        roomCode;

    peer =
        new Peer(
            peerId,
            {
                debug: 1
            }
        );

    peer.on(
        "open",
        id => {

            myId = id;

            game =
                createGameState();

            game.players.push({

                id: myId,

                nick:
                    localStorage.getItem(
                        "tricko_nickname"
                    ) || "Игрок",

                score: 0,

                roundScore: 0,

                bid: null,

                tricks: 0,

                connected: true,

                hand: []
            });

            showScreen(
                "lobbyScreen"
            );

            render();

            toast(
                "Комната создана"
            );
        }
    );


    peer.on(
        "connection",
        conn => {

            connections[
                conn.peer
            ] = conn;

            conn.on(
                "open",
                () => {

                    /*
                        Пока игрок ещё не отправил join.
                    */

                }
            );

            conn.on(
                "data",
                data => {

                    handleHostMessage(
                        conn,
                        data
                    );
                }
            );

            conn.on(
                "close",
                () => {

                    if (!game)
                        return;

                    const player =
                        game.players.find(
                            p =>
                                p.id ===
                                conn.peer
                        );

                    if (player) {

                        player.connected =
                            false;

                        sendFullState();
                    }
                }
            );

            conn.on(
                "error",
                error => {

                    console.error(
                        "Connection error:",
                        error
                    );
                }
            );
        }
    );


    peer.on(
        "error",
        error => {

            console.error(
                "Peer error:",
                error
            );

            if (
                error.type ===
                "unavailable-id"
            ) {

                toast(
                    "Не удалось создать комнату. Попробуйте ещё раз."
                );

            } else if (
                error.type ===
                "network"
            ) {

                toast(
                    "Нет соединения с сервером PeerJS"
                );

            } else {

                toast(
                    "Ошибка соединения: " +
                    error.type
                );
            }
        }
    );
}


/* =========================================================
   HOST MESSAGE
========================================================= */

function handleHostMessage(
    conn,
    data
) {

    if (
        !data ||
        !game
    ) {
        return;
    }

    if (
        data.type === "join"
    ) {

        if (
            game.players.length >= 4
        ) {

            conn.send({

                type: "error",

                message:
                    "В комнате уже 4 игрока"

            });

            return;
        }

        if (
            game.phase !== "lobby"
        ) {

            conn.send({

                type: "error",

                message:
                    "Игра уже началась"

            });

            return;
        }

        const existing =
            game.players.find(
                player =>
                    player.id ===
                    conn.peer
            );

        if (existing) {

            existing.connected =
                true;

            sendFullState();

            return;
        }

        const nick =
            String(
                data.nick ||
                "Игрок"
            )
            .trim()
            .slice(0, 20);

        game.players.push({

            id: conn.peer,

            nick:
                nick || "Игрок",

            score: 0,

            roundScore: 0,

            bid: null,

            tricks: 0,

            connected: true,

            hand: []
        });

        sendFullState();

        /*
            Запускаем таймер только один раз.
        */

        if (
            game.players.length >= 2 &&
            !lobbyStartTimer
        ) {

            lobbyStartTimer =
                setTimeout(
                    () => {

                        lobbyStartTimer =
                            null;

                        if (
                            game &&
                            game.phase ===
                            "lobby" &&
                            game.players.length >= 2
                        ) {

                            game.roundIndex =
                                0;

                            startRound();
                        }

                    },
                    3000
                );
        }

        return;
    }


    if (
        data.type === "bid"
    ) {

        hostReceiveBid(
            conn.peer,
            data.value
        );

        return;
    }


    if (
        data.type === "play"
    ) {

        hostReceivePlay(
            conn.peer,
            data.tileId
        );

        return;
    }
}


/* =========================================================
   JOIN
========================================================= */

function joinRoom() {

    const nick =
        $("nickname")
            .value
            .trim();

    const code =
        $("roomInput")
            .value
            .trim()
            .toUpperCase();

    if (!nick) {

        toast(
            "Введите имя"
        );

        return;
    }

    if (!code) {

        toast(
            "Введите код игры"
        );

        return;
    }

    localStorage.setItem(
        "tricko_nickname",
        nick
    );

    roomCode =
        code;

    isHost = false;

    peer =
        new Peer({
            debug: 1
        });

    peer.on(
        "open",
        id => {

            myId = id;

            const hostId =
                "domino-" +
                roomCode;

            const conn =
                peer.connect(
                    hostId,
                    {
                        reliable: true,
                        serialization: "json"
                    }
                );

            connections.host =
                conn;

            conn.on(
                "open",
                () => {

                    conn.send({

                        type: "join",

                        nick
                    });

                    toast(
                        "Подключено"
                    );
                }
            );

            conn.on(
                "data",
                data => {

                    if (
                        data.type ===
                        "state"
                    ) {

                        receiveState(
                            data
                        );
                    }

                    if (
                        data.type ===
                        "error"
                    ) {

                        toast(
                            data.message
                        );
                    }
                }
            );

            conn.on(
                "close",
                () => {

                    toast(
                        "Соединение с хостом потеряно"
                    );
                }
            );

            conn.on(
                "error",
                error => {

                    console.error(
                        "Connection error:",
                        error
                    );

                    toast(
                        "Ошибка соединения"
                    );
                }
            );
        }
    );


    peer.on(
        "error",
        error => {

            console.error(
                "Peer error:",
                error
            );

            if (
                error.type ===
                "peer-unavailable"
            ) {

                toast(
                    "Игра с таким кодом не найдена"
                );

            } else {

                toast(
                    "Не удалось подключиться: " +
                    error.type
                );
            }
        }
    );
}


/* =========================================================
   SEND TO HOST
========================================================= */

function sendToHost(data) {

    const conn =
        connections.host;

    if (
        conn &&
        conn.open
    ) {

        conn.send(data);

    } else {

        toast(
            "Нет соединения с комнатой"
        );
    }
}


/* =========================================================
   CREATE ROOM
========================================================= */

function createRoom() {

    const nick =
        $("nickname")
            .value
            .trim();

    if (!nick) {

        toast(
            "Введите имя"
        );

        return;
    }

    localStorage.setItem(
        "tricko_nickname",
        nick
    );

    /*
        Полностью закрываем старый Peer,
        если пользователь создаёт комнату
        повторно после ошибки.
    */

    if (peer) {

        try {
            peer.destroy();
        } catch {}

        peer = null;
    }

    roomCode =
        randomRoomCode();

    isHost = true;

    createHostPeer();
}


/* =========================================================
   COPY
========================================================= */

async function copyRoomCode() {

    try {

        await navigator.clipboard.writeText(
            roomCode
        );

        toast(
            "Код скопирован"
        );

    } catch {

        toast(
            "Код: " + roomCode
        );
    }
}


/* =========================================================
   LEAVE
========================================================= */

function leaveGame() {

    if (lobbyStartTimer) {

        clearTimeout(
            lobbyStartTimer
        );

        lobbyStartTimer =
            null;
    }

    Object.values(
        connections
    ).forEach(
        conn => {

            try {
                conn.close();
            } catch {}

        }
    );

    connections = {};

    if (peer) {

        try {
            peer.destroy();
        } catch {}
    }

    peer = null;

    game = null;

    roomCode = "";

    myId = "";

    isHost = false;

    showScreen(
        "homeScreen"
    );
}


/* =========================================================
   RESULT
========================================================= */

function renderResult() {

    showScreen(
        "resultScreen"
    );

    const winner =
        game.players.find(
            player =>
                player.id ===
                game.winner
        );

    $("winner").textContent =
        winner
            ? `${winner.nick} победил!`
            : "Победитель определён";

    const sorted =
        [...game.players].sort(
            (a, b) =>
                b.score - a.score
        );

    $("finalScores").innerHTML =
        sorted.map(
            (player, index) => `

                <div class="final-player">

                    <div class="final-player-name">

                        ${
                            index === 0
                                ? "🏆 "
                                : ""
                        }

                        ${escapeHTML(
                            player.nick
                        )}

                    </div>

                    <strong>
                        ${player.score}
                    </strong>

                </div>

            `
        ).join("");
}


/* =========================================================
   EVENTS
========================================================= */

$("createBtn")
    .addEventListener(
        "click",
        createRoom
    );


$("joinBtn")
    .addEventListener(
        "click",
        joinRoom
    );


$("copyRoomBtn")
    .addEventListener(
        "click",
        copyRoomCode
    );


$("leaveLobbyBtn")
    .addEventListener(
        "click",
        leaveGame
    );


$("leaveGameBtn")
    .addEventListener(
        "click",
        leaveGame
    );


$("newGameBtn")
    .addEventListener(
        "click",
        leaveGame
    );


$("roomInput")
    .addEventListener(
        "input",
        event => {

            event.target.value =
                event.target.value
                    .toUpperCase()
                    .replace(
                        /[^A-Z0-9]/g,
                        ""
                    )
                    .slice(0, 5);
        }
    );


$("nickname")
    .addEventListener(
        "input",
        event => {

            localStorage.setItem(
                "tricko_nickname",
                event.target.value
            );
        }
    );

</script>

</body>
</html>
